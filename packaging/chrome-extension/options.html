<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 560px;
        margin: 40px auto;
        color: #17171f;
      }
      label { display: block; font-weight: 600; margin-bottom: 6px; }
      input {
        width: 100%;
        padding: 10px;
        font-family: ui-monospace, monospace;
        font-size: 13px;
        border: 2px solid #e4e4ea;
        border-radius: 4px;
        box-sizing: border-box;
      }
      input:focus { outline: none; border-color: #2f2fd3; }
      button {
        margin-top: 12px;
        background: #2f2fd3;
        color: #fff;
        border: 0;
        padding: 10px 22px;
        border-radius: 4px;
        font-weight: 700;
        cursor: pointer;
      }
      .hint { color: #6b6b76; font-size: 13px; line-height: 1.5; }
      #saved { color: #1a7f37; font-size: 13px; margin-left: 10px; }
    </style>
  </head>
  <body>
    <h2>Domain Authority Explorer — Settings</h2>
    <label for="baseUrl">App URL</label>
    <input id="baseUrl" placeholder="https://your-app.replit.app" />
    <p class="hint">
      Paste the URL of your published Domain Authority Explorer app (no trailing
      slash needed). The extension calls its public API to fetch scores.
    </p>
    <button id="save">Save</button><span id="saved"></span>
    <script src="options.js"></script>
  </body>
</html>
